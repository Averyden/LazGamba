<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LazGamba</title>
    <link rel="icon" href="assets/img/GAMBA imgs/speen.webp" />
    <link rel="stylesheet" href="src/stylesheets/main.css" />
    <link rel="stylesheet" href="src/stylesheets/popup.css" />
    <link rel="stylesheet" href="src/stylesheets/animationHandler.css" />
    <script type="module" src="src/scripts/compiledJS/main.js"></script>
  </head>
  <body>
    <canvas id="starfield" style="z-index: -10"></canvas>
    <!-- For future reference, you could potentially buy better gambas and the background changed accordingly to a certain one, the best "case" could reactivate the starfield maybe???? -->
    <div id="currencyContainer">
      <div id="coinLabel">Error fetching currency...</div>
      <div id="resetLabel">Error fetching daily bonus timer...</div>
    </div>

    <div id="mainDiv">
      <h1 class="mainItems" id="gambaStatus"></h1>

      <img
        class="mainItems"
        id="gambaStatusImg"
        src="assets/img/GAMBA imgs/waiting.webp" />

      <button class="mainItems" id="gambaBtn">GAMBA</button>
      <h2 class="mainItems" id="gambaCost">Error fetching price...</h2>
    </div>

    <div id="top">
      <h1 id="caseName">Error fetching name of gamba...</h1>
      <button id="purchaseCaseBtn">Unlock</button>
    </div>

    <div id="sideButtons">
      <button id="changeCaseleft"><</button>
      <button id="changeCaseRight">></button>
    </div>

    <div id="bottom">
      <h1 id="versionIdentifier">version not found</h1>
      <button id="caseTip">?</button>
    </div>

    <div class="popup-container" id="popupContainer">
      <div class="popup">
        <span class="popup-title" id="popupTitle"></span>
        <span class="popup-message" id="popupText"></span>
        <div class="popup-buttons">
          <button id="btnCancel">Cancel</button>
          <button id="btnConfirm">Confirm</button>
        </div>
      </div>
    </div>
  </body>
</html>
